name: release

# 变体：dsh-paste-dock 手写（不走模板渲染）
# 原因：privacy-scan 必须在 install 前、build 是复合命令、smoke.mjs 非 npm run、
#       artifact check 在 build 之后 lint 之前（与模板"gate 后统一 artifact"不同序）
# 必须包含：id-token: write + --provenance --access public

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:      { description: '要发布的 tag（如 v0.1.12）', required: true, type: string }
      dry_run:  { description: '只打包不推 npm', type: boolean, default: true }

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # ① 版本对齐
      - name: 版本对齐
        run: |
          set -euo pipefail
          V="${TAG#v}"
          P=$(node -p "require('./package.json').version")
          [ "$V" = "$P" ] || { echo "::error::tag $TAG 与 package.json $P 不一致"; exit 1; }
          for f in dsh.plugin.json dsh-plugin.json; do
            [ -f "$f" ] || continue
            D=$(node -p "try{require('./$f').version||''}catch{''}" 2>/dev/null || echo "")
            [ -z "$D" ] || [ "$D" = "$P" ] || { echo "::error::$f 的 $D 与 $P 不一致"; exit 1; }
          done
          echo "VERSION=$P"        >> "$GITHUB_ENV"
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      # ② Privacy gate（ci.yml 在 install 前跑，必须保留此序）
      - name: Privacy gate
        run: node tools/privacy-scan.mjs

      # ③ 安装依赖
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ④ 门禁（按 ci.yml 顺序）
      - name: 门禁
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run build && pnpm run build:client
          pnpm run lint
          pnpm run format:check
          pnpm run metrics
          pnpm test

      # ⑤ 产物一致性（build 后、smoke 前，与 ci.yml 对齐）
      - name: 产物一致性
        run: git diff --exit-code -- dist lib

      # ⑥ Smoke
      - name: Smoke
        run: node smoke.mjs

      # ⑦ 打包清单
      - name: 打包清单
        run: pnpm pack --dry-run 2>/dev/null || npm pack --dry-run

      # ⑧ 幂等
      - name: 幂等检查
        id: guard
        run: |
          if npm view "$PKG_NAME@$VERSION" version --registry https://registry.npmjs.org 2>/dev/null | grep -q .; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::warning::$PKG_NAME@$VERSION 已存在于 registry，跳过 publish/dist-tag/Release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ⑨ 发布
      - name: npm publish
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        run: npm publish --provenance --access public --registry https://registry.npmjs.org

      # ⑩ dist-tag 同步
      - name: 同步 dsh-* 线标签
        id: disttag
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        run: |
          set -uo pipefail
          REG=https://registry.npmjs.org
          for attempt in 1 2 3 4 5 6; do
            RAW=$(npm view "$PKG_NAME" dist-tags --json --registry "$REG" 2>/dev/null)
            if [ -n "${RAW:-}" ]; then
              TAGS=$(printf '%s' "$RAW" \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Object.keys(JSON.parse(s)).filter(t=>t.startsWith('dsh-')).join(' '))}catch{console.log('')}})")
              if [ -z "${TAGS:-}" ]; then
                echo "::notice::$PKG_NAME 没有 dsh-* 线标签，无需同步"
                echo "synced=none" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ok=1
              for t in $TAGS; do
                npm dist-tag add "$PKG_NAME@$VERSION" "$t" --registry "$REG" || ok=0
              done
              [ "$ok" = 1 ] && { echo "synced=$TAGS" >> "$GITHUB_OUTPUT"; exit 0; }
            fi
            echo "第 $attempt 轮未拿到 dist-tags（读侧滞后），30s 后重试"; sleep 30
          done
          echo "::warning::线标签同步未完成，需本地补跑"
          echo "synced=PENDING" >> "$GITHUB_OUTPUT"

      # ⑪ GitHub Release
      - name: GitHub Release
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > notes.md
          if [ -f scripts/release-notes.mjs ]; then
            node scripts/release-notes.mjs --version "$VERSION" --tag "$TAG" --out notes.md 2>/dev/null || : > notes.md
          fi
          if [ ! -s notes.md ] && [ -f CHANGELOG.md ]; then
            START=$(grep -n "^## .*${VERSION}" CHANGELOG.md | head -1 | cut -d: -f1 || true)
            if [ -n "${START:-}" ]; then
              END=$(awk -v s="$START" 'NR>s && /^## /{print NR; exit}' CHANGELOG.md || true)
              TOTAL=$(wc -l < CHANGELOG.md)
              END=${END:-$((TOTAL + 1))}
              sed -n "${START},$((END - 1))p" CHANGELOG.md > notes.md
            fi
          fi
          SIZE=$(wc -c < notes.md | tr -d ' ')
          if [ "${SIZE:-0}" -ge 80 ]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          gh release edit "$TAG" --latest

      # ⑫ 事实表
      - name: Job Summary
        if: always()
        run: |
          {
            echo "### $TAG"
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 包 | ${PKG_NAME:-?} |"
            echo "| 版本 | ${VERSION:-?} |"
            echo "| 已存在跳过 | ${{ steps.guard.outputs.exists }} |"
            echo "| 线标签 | ${{ steps.disttag.outputs.synced || '-' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
